# Jekyll configuration — GitHub Pages compatible
# Site settings
title: "Ph.D. researcher"
email: "researcher@university.edu"
description: >-
  PhD researcher working on AI, machine learning, and ... .
baseurl: "/modernist-template" # Set to "/<project-name>" if deploying as a subproject; leave empty for <username>.github.io
url: "tenbatsu24.github.io" # Set to "https://yourusername.github.io" when deploying

# Author profile
author:
  name: Daily Name
  email: "researcher@university.edu"
  image: "assets/images/profile.png"  # path relative to site baseurl (leave empty to hide)
  github: "GITHUB_USERNAME"  # comment out to hide
  scholar: "GOOGLE_SCHOLAR_ID"  # comment out to hide
  twitter: "TWITTER_HANDLE"  # comment out to hide
  bluesky: "BLUESKY_HANDLE"  # comment out to hide (e.g. "handle.bsky.social")
  linkedin: "LINKEDIN_HANDLE"  # comment out to hide
  mastodon: "MASTODON_HANDLE"  # comment out to hide (e.g. "@handle@mastodon.social")
  orcid: "ORCID_ID"  # comment out to hide
  cv: "CV_FILENAME.pdf"  # comment out to hide (path relative to site baseurl, e.g. "assets/files/cv.pdf")
  website: "https://example.com"  # comment out to hide

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Markdown
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    style: monokai

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      categories:
        - post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Exclude from processing
exclude:
  - README.md
  - assets/images/svgs
